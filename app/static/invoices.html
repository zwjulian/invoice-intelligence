<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Invoices - Invoice Intelligence
    </title>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >
</head>

<body>

<nav class="navbar">
    <div class="container nav-inner">

        <a
            href="/"
            class="brand"
        >
            Invoice Intelligence
        </a>

        <div class="nav-links">

            <a href="/">
                Dashboard
            </a>

            <a
                href="/invoices"
                class="active"
            >
                Invoices
            </a>

            <a href="/analytics">
                Analytics
            </a>

            <a href="/docs">
                API
            </a>

        </div>

    </div>
</nav>


<main class="container">

    <div class="page-header">

        <div>
            <h1>Invoices</h1>

            <div class="subtitle">
                Review and manage all
                processed invoices.
            </div>
        </div>

    </div>


    <div class="card">

        <div class="filters">

            <button
                class="filter-button active"
                data-filter="all"
                onclick="setFilter('all')"
            >
                All
            </button>

            <button
                class="filter-button"
                data-filter="new"
                onclick="setFilter('new')"
            >
                New
            </button>

            <button
                class="filter-button"
                data-filter="approved"
                onclick="setFilter('approved')"
            >
                Approved
            </button>

            <button
                class="filter-button"
                data-filter="paid"
                onclick="setFilter('paid')"
            >
                Paid
            </button>

            <button
                class="filter-button"
                data-filter="overdue"
                onclick="setFilter('overdue')"
            >
                Overdue
            </button>

            <button
                class="filter-button"
                data-filter="duplicates"
                onclick="setFilter('duplicates')"
            >
                Duplicates
            </button>

        </div>

    </div>


    <div class="card">

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Supplier</th>
                        <th>Invoice number</th>
                        <th>Invoice date</th>
                        <th>Due date</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Checks</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody
                    id="invoiceTable"
                ></tbody>

            </table>

        </div>

        <div
            id="emptyState"
            class="empty-state hidden"
        >
            No invoices match this filter.
        </div>

    </div>

</main>


<script>

let invoices = [];

let currentFilter =
    "all";


function formatMoney(
    value,
    currency
) {
    if (
        value === null ||
        value === undefined
    ) {
        return "—";
    }

    return (
        `${currency || ""} `
        + Number(value).toLocaleString(
            undefined,
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        )
    ).trim();
}


function statusBadge(
    status
) {
    const labels = {
        new: "New",
        approved: "Approved",
        paid: "Paid"
    };

    return `
        <span
            class="badge badge-${status}"
        >
            ${labels[status] || status}
        </span>
    `;
}


function isOverdue(
    invoice
) {
    if (
        !invoice.due_date ||
        invoice.status === "paid"
    ) {
        return false;
    }

    const due =
        new Date(
            `${invoice.due_date}T23:59:59`
        );

    return due < new Date();
}


function filteredInvoices() {

    if (
        currentFilter === "all"
    ) {
        return invoices;
    }


    if (
        currentFilter === "overdue"
    ) {
        return invoices.filter(
            invoice =>
                isOverdue(
                    invoice
                )
        );
    }


    if (
        currentFilter
        === "duplicates"
    ) {
        return invoices.filter(
            invoice =>
                invoice
                    .duplicate_of_id
                !== null
        );
    }


    return invoices.filter(
        invoice =>
            invoice.status
            === currentFilter
    );
}


function setFilter(
    filter
) {
    currentFilter =
        filter;


    document.querySelectorAll(
        ".filter-button"
    ).forEach(
        button => {
            button.classList.remove(
                "active"
            );
        }
    );


    document.querySelector(
        `[data-filter="${filter}"]`
    ).classList.add(
        "active"
    );


    renderInvoices();
}


function renderInvoices() {

    const body =
        document.getElementById(
            "invoiceTable"
        );

    const empty =
        document.getElementById(
            "emptyState"
        );


    body.innerHTML = "";


    const visible =
        filteredInvoices();


    if (
        visible.length === 0
    ) {
        empty.classList.remove(
            "hidden"
        );

        return;
    }


    empty.classList.add(
        "hidden"
    );


    for (
        const invoice
        of visible
    ) {

        let checks = "";


        checks += invoice.valid
            ? (
                '<span class="badge badge-valid">'
                + 'Valid'
                + '</span> '
            )
            : (
                '<span class="badge badge-invalid">'
                + 'Review'
                + '</span> '
            );


        if (
            invoice.duplicate_of_id
            !== null
        ) {
            checks +=
                '<span class="badge badge-duplicate">'
                + 'Duplicate'
                + '</span> ';
        }


        if (
            isOverdue(
                invoice
            )
        ) {
            checks +=
                '<span class="badge badge-overdue">'
                + 'Overdue'
                + '</span>';
        }


        const row =
            document.createElement(
                "tr"
            );


        row.innerHTML = `
            <td>
                ${invoice.id}
            </td>

            <td>
                ${invoice.supplier_name || "—"}
            </td>

            <td>
                ${invoice.invoice_number || "—"}
            </td>

            <td>
                ${invoice.invoice_date || "—"}
            </td>

            <td>
                ${invoice.due_date || "—"}
            </td>

            <td>
                ${formatMoney(
                    invoice.total_amount,
                    invoice.currency
                )}
            </td>

            <td>
                ${statusBadge(
                    invoice.status
                )}
            </td>

            <td>
                ${checks}
            </td>

            <td>
                <a
                    href="/invoices/${invoice.id}"
                    class="button"
                >
                    View
                </a>
            </td>
        `;


        body.appendChild(
            row
        );
    }
}


async function loadInvoices() {

    const response =
        await fetch(
            "/api/invoices"
        );


    if (!response.ok) {
        return;
    }


    invoices =
        await response.json();


    renderInvoices();
}


loadInvoices();

</script>

</body>

</html>
